<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>答题卡分数识别系统</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="capture-pane">
        <div class="viewer">
          <video id="camera" autoplay playsinline muted></video>
          <img id="preview" alt="当前答题卡预览" />
          <canvas id="snapshot"></canvas>
          <div id="emptyPreview" class="empty-preview">未加载画面</div>
        </div>
        <div class="capture-toolbar">
          <button id="startCamera" class="tool-button">打开摄像头</button>
          <button id="capturePhoto" class="tool-button primary">拍照识别</button>
          <button id="stopCamera" class="tool-button">关闭</button>
        </div>
        <div class="folder-strip">
          <button id="folderButton" class="tool-button warning">从文件夹导入</button>
          <input id="folderInput" type="file" accept="image/*" webkitdirectory directory multiple hidden />
          <input id="fileInput" type="file" accept="image/*" multiple hidden />
          <button id="fileButton" class="tool-button">选择图片</button>
          <select id="fileQueue"></select>
          <button id="recognizeSelected" class="icon-button" title="识别当前图片">识别</button>
        </div>
      </section>

      <section class="work-pane">
        <div id="status" class="status warning">未检测到答题卡，请拍照或导入图片</div>
        <div class="action-row">
          <button id="recognizeAgain" class="action-button blue">重新识别</button>
          <button id="confirmRecord" class="action-button green">确认并记录</button>
        </div>
        <section class="panel">
          <div class="section-title">身份信息</div>
          <label class="field-line"><span>学号</span><input id="studentId" type="text" autocomplete="off" placeholder="识别结果..." /></label>
          <label class="field-line"><span>姓名</span><input id="studentName" type="text" autocomplete="off" placeholder="识别结果..." /></label>
        </section>
        <section class="panel scores-panel">
          <div class="section-title">各题分数</div>
          <div class="table-wrap">
            <table class="score-table">
              <thead><tr><th>题目</th><th>分数</th><th>置信度</th></tr></thead>
              <tbody id="scoreBody"></tbody>
            </table>
          </div>
          <div class="total-line">总分：<strong id="totalScore">--</strong></div>
        </section>
        <section class="panel records-panel">
          <div class="records-header">
            <div class="section-title">已记录列表</div>
            <div class="records-actions">
              <button id="deleteSelected" class="small-button">删除选中</button>
              <button id="clearAll" class="small-button">清空全部</button>
              <button id="exportExcel" class="small-button strong">导出Excel</button>
            </div>
          </div>
          <div class="table-wrap records-table-wrap">
            <table class="records-table"><thead><tr id="recordHead"></tr></thead><tbody id="recordBody"></tbody></table>
          </div>
        </section>
      </section>
    </main>
    <script>window.SCORE_FIELDS = {{ score_fields|tojson }};</script>
    <script src="/static/app.js"></script>
  </body>
</html>
